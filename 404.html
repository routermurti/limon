<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#101a15">
  <title>Sayfa Bulunamadı | Limon</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#253c2c,#101a15 65%);color:#f6f2e7;padding:24px}
    main{text-align:center;max-width:550px}
    .paw{font-size:56px;line-height:1.2;display:block;margin-bottom:16px}
    h1{font-size:clamp(2rem,7vw,3.5rem);margin:0 0 12px}
    p{font-size:1.08rem;line-height:1.7;color:#d0d5cc;margin:0 0 28px}
    a{display:inline-block;background:#d8b66a;color:#172016;text-decoration:none;padding:14px 24px;border-radius:12px;font-weight:700}
    a:hover,a:focus-visible{background:#f1d08b;outline-offset:4px}
    small{display:block;margin-top:36px;color:#aeb7a9}
  </style>
</head>
<body>
  <main>
    <span class="paw" aria-hidden="true">🐾</span>
    <h1>Bu sayfa bulunamadı.</h1>
    <p>Limon başka bir patikaya gitmiş olabilir. Ana sayfaya dönüp yolculuğuna devam edebilirsin.</p>
    <a href="/limon/">Limon'un ana sayfasına dön</a>
    <small>Limon · Bir dostluğun hatırası</small>
  </main>
</body>
</html>
